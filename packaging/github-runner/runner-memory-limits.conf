# systemd drop-in: cap RAM per GitHub Actions listener so mold/cargo test cannot
# OOM the desktop. Install on EVERY actions.runner.*.service on a shared workstation.
#
#   sudo cp runner-memory-limits.conf \
#     /etc/systemd/system/actions.runner.ORG.REPO.HOSTNAME.service.d/limits.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart actions.runner.ORG.REPO.HOSTNAME.service
#
# Tune MemoryMax for host RAM and listener count (example: 92G box, 2 listeners → 32G each).

[Service]
MemoryMax=32G
MemorySwapMax=8G
OOMPolicy=stop
Restart=on-failure
RestartSec=10
StartLimitBurst=5
StartLimitIntervalSec=300
