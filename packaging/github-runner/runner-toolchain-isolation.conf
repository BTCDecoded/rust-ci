# Drop-in for a second (or Nth) GitHub Actions runner on the same host when all
# services use the same Unix user (e.g. github-runner). Without this, concurrent
# jobs on zeus-workstation and zeus-workstation-2 race on ~/.cargo/bin/cargo
# (rustup proxy) and hit ETXTBSY / exit 126.
#
# Install (example: zeus-workstation-2):
#   sudo mkdir -p /etc/systemd/system/actions.runner.BTCDecoded.zeus-workstation-2.service.d
#   sudo cp runner-toolchain-isolation.conf \
#     /etc/systemd/system/actions.runner.BTCDecoded.zeus-workstation-2.service.d/toolchain.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart actions.runner.BTCDecoded.zeus-workstation-2.service
#
# Then run bootstrap-isolated-runner-toolchain.sh once for that runner home.
#
# Customize RUNNER_HOME to match the runner's WorkingDirectory parent
# (/var/lib/github-runner-2 for the second listener on Zeus).

[Service]
Environment=HOME=/var/lib/github-runner-2
Environment=CARGO_HOME=/var/lib/github-runner-2/.cargo
Environment=RUSTUP_HOME=/var/lib/github-runner-2/.rustup
Environment=PATH=/var/lib/github-runner-2/.cargo/bin:/usr/local/bin:/usr/bin
